name: Daily Retail News Report

on:
  schedule:
    # メイン: 毎日JST午前8時47分（UTC 23:47）に実行（お昼11:30〜12:30頃の着地狙い）
    - cron: '47 23 * * *'
    # バックアップ: メインが遅延・不発の場合の保険（JST 11:37 = UTC 2:37）
    - cron: '37 2 * * *'
  workflow_dispatch: # 手動実行用ボタン

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run script
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          NOTE_SESSION_COOKIES: ${{ secrets.NOTE_SESSION_COOKIES }}
          GITHUB_ACTIONS: "true"
          PYTHONIOENCODING: "utf-8"
          PYTHONUTF8: "1"
        shell: bash
        run: |
          python tools/neta_gatherer/neta_gatherer.py
